<style>
:root{
  color-scheme: light;
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#172033; --muted:#4B5563; --line:#D6DAE1;
  --mark:#B45309; --mark-ink:#92400E; --mark-bg:#FEF3E2; --star:#C2410C; --accent:#0B6E6E;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Segoe UI',system-ui,sans-serif;
  --arabic:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme: dark;
    --bg:#0F1622; --surface:#182233; --ink:#E7ECF3; --muted:#A9B4C4; --line:#2E3B52;
    --mark:#F59E0B; --mark-ink:#FCD34D; --mark-bg:#3A2A10; --star:#FB923C; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 32px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--accent);margin:0 0 4px}
@media (prefers-color-scheme: dark){.eyebrow{color:var(--ink);opacity:.8}}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(26px,4.5vw,34px);line-height:1.1}
.other{font-size:14px;color:var(--muted)}
.other a{color:inherit;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:600 14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-color-scheme: dark){button:focus-visible{outline-color:#93C5FD}}
button.on{color:#FFFFFF;border-color:var(--c,var(--ink));background:var(--c,var(--ink))}
@media (prefers-color-scheme: dark){button.on.all{color:var(--bg)}}
.filters button.mk{color:var(--mark-ink)}
.filters button.mk.on{background:var(--mark);border-color:var(--mark);color:#FFFFFF}
.filters button.st{color:var(--star)}
.filters button.st.on{background:var(--star);border-color:var(--star);color:#FFFFFF}
svg.bm{width:17px;height:17px;flex-shrink:0}
svg.bm path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.on svg.bm path,.marked svg.bm path{fill:currentColor}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grp{font-size:14px;font-weight:600;color:var(--gc)}
@media (prefers-color-scheme: dark){.grp{color:var(--ink);opacity:.85}}
button.markbtn.marked{background:var(--mark-bg);border-color:var(--mark);color:var(--mark-ink)}
.card{all:unset;display:block;position:relative;width:100%;height:clamp(300px,52vh,440px);perspective:1400px;cursor:pointer;border-radius:18px}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.inner{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;border:1px solid var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px clamp(18px,5vw,48px);overflow:auto}
.front{background:var(--surface);color:var(--ink)}
.back{background:var(--gc);border-color:var(--gc);color:#FFFFFF;transform:rotateY(180deg)}
.kind{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--gc)}
@media (prefers-color-scheme: dark){.kind{color:var(--ink);opacity:.8}}
.term{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1.12;max-width:720px;overflow-wrap:anywhere}
.term.long{font-size:clamp(24px,4.6vw,34px)}
.pos{font-size:18px;font-style:italic;color:var(--muted);margin-left:10px;font-family:var(--body);font-weight:400}
.hint{font-size:14px;color:var(--muted)}
.badge{display:none;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mark)}
.badge.show{display:inline-flex}
.backterm{font-size:15px;font-weight:600;opacity:.88}
.def{font-size:clamp(19px,3.2vw,25px);line-height:1.38;font-weight:600;max-width:700px}
.def.long{font-size:clamp(17px,2.7vw,21px)}
.ar{font-family:var(--arabic);font-size:clamp(20px,3.4vw,24px);line-height:1.5;font-weight:500}
.ar.big{font-size:clamp(28px,5vw,36px)}
.ex{font-size:15px;opacity:.92;max-width:660px}
.ex.q{font-style:italic}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav .mid{display:flex;align-items:center;gap:10px}
.count{font-weight:600;font-size:15px;min-width:72px;text-align:center}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:4px 0 0}
.keys span{display:inline-flex;align-items:center;gap:4px}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;background:var(--surface);font:600 12px var(--body);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){
  .wrap{padding:18px 14px 24px}
  .nav button.pn{padding:0 12px}
  .nav .lbl{display:none}
  .keys{display:none}
  #groups,#units{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
  #groups::-webkit-scrollbar,#units::-webkit-scrollbar{display:none}
  #groups button,#units button{flex-shrink:0}
}
@media (hover:none){.keys{display:none}}
@media (prefers-reduced-motion: reduce){.inner{transition:none}}
</style>
</head>

:"technology","p":"n","d":"","a":"تكنولوجيا","e":"","s":0,"g":3,"u":4},{"t":"pollution","p":"n","d":"","a":"تلوّث","e":"","s":0,"g":3,"u":4},{"t":"insect","p":"n","d":"","a":"حشرة","e":"","s":0,"g":3,"u":4},{"t":"destroy","p":"v","d":"","a":"يدمّر","e":"","s":0,"g":3,"u":4},{"t":"repair","p":"v","d":"","a":"يصلح","e":"","s":0,"g":3,"u":4},{"t":"shake","p":"v","d":"","a":"يهزّ","e":"","s":0,"g":3,"u":4},{"t":"dangerous","p":"adj","d":"","a":"خطير","e":"","s":0,"g":3,"u":4},{"t":"discover","p":"v","d":"","a":"يكتشف","e":"","s":0,"g":3,"u":4},{"t":"produce","p":"v","d":"","a":"ينتج","e":"","s":0,"g":3,"u":4},{"t":"provide","p":"v","d":"","a":"يوفّر / يزوّد","e":"","s":0,"g":3,"u":4},{"t":"prepare","p":"v","d":"","a":"يحضّر / يجهّز","e":"","s":0,"g":3,"u":4},{"t":"require","p":"v","d":"","a":"يتطلّب","e":"","s":0,"g":3,"u":4},{"t":"lead","p":"v","d":"","a":"يقود","e":"","s":0,"g":3,"u":4},{"t":"form","p":"v","d":"","a":"يشكّل","e":"","s":0,"g":3,"u":4},{"t":"connect","p":"v","d":"","a":"يتّصل / يربط","e":"","s":0,"g":3,"u":4},{"t":"focus","p":"v","d":"","a":"يركّز","e":"","s":0,"g":3,"u":4},{"t":"attention","p":"n","d":"","a":"انتباه","e":"","s":0,"g":3,"u":4},{"t":"repeat","p":"v","d":"","a":"يكرّر","e":"","s":0,"g":3,"u":4},{"t":"forget","p":"v","d":"","a":"ينسى","e":"","s":0,"g":3,"u":4},{"t":"move","p":"v","d":"","a":"ينتقل / يتحرّك","e":"","s":0,"g":3,"u":4},{"t":"activity","p":"n","d":"","a":"نشاط","e":"","s":0,"g":3,"u":4},{"t":"exciting","p":"adj","d":"","a":"مثير","e":"","s":0,"g":3,"u":4},{"t":"enjoyable","p":"adj","d":"","a":"ممتع","e":"","s":0,"g":3,"u":4},{"t":"pretty","p":"adj","d":"","a":"جميل","e":"","s":0,"g":3,"u":4},{"t":"similar","p":"adj","d":"","a":"مشابه","e":"","s":0,"g":3,"u":4},{"t":"whole","p":"adj","d":"","a":"كامل","e":"","s":0,"g":3,"u":4},{"t":"area","p":"n","d":"","a":"منطقة / مجال","e":"","s":0,"g":3,"u":4},{"t":"however","p":"adv","d":"contrast: what follows changes direction","a":"لكن / ومع ذلك","e":"","s":0,"g":3,"u":5},{"t":"accordin (function(){
  const $ = (id) => document.getElementById(id);
  const ICON = '<svg class="bm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.5L5 21V4.5a1 1 0 0 1 1-1z"/></svg>';
  DECK.cards.forEach((c, k) => { c.id = k; });

  function load(key, fallback){ try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e){ return fallback; } }
  function save(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

  const S = { g:-1, u:-1, star:false, mk:false, flip:false, i:0, seed:0, marks: load(DECK.key, {}) };

  function order(n, seed){
    const a = []; for (let k = 0; k < n; k++) a.push(k);
    if (!seed) return a;
    let s = seed;
    for (let k = n - 1; k > 0; k--){ s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; }
    return a;
  }
  function deck(){
    const base = DECK.cards.filter(c => (S.g < 0 || c.g === S.g) && (S.u < 0 || c.u === S.u) && (!S.star || c.s) && (!S.mk || S.marks[c.id]));
    return order(base.length, S.seed).map(k => base[k]);
  }
  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function set(o){ Object.assign(S, { flip:false, i:0 }, o); render(); }

  function renderFilters(){
    const f = $("filters"); f.textContent = "";
    const n = Object.keys(S.marks).length;
    const mk = el("button", "mk" + (S.mk ? " on" : ""));
    mk.innerHTML = ICON; mk.append("Marked (" + n + ")");
    mk.setAttribute("aria-pressed", S.mk); mk.title = "Show only cards marked for revision (B)";
    mk.onclick = () => set({ mk: !S.mk });
    f.append(mk);
    if (DECK.star){
      const st = el("button", "st" + (S.star ? " on" : ""), "★ Priority only");
      st.setAttribute("aria-pressed", S.star); st.title = "Show only high-priority words (P)";
      st.onclick = () => set({ star: !S.star });
      f.append(st);
    }
  }
  function chip(label, on, color, fn, isAll){
    const b = el("button", (on ? "on" : "") + (isAll ? " all" : ""), label);
    b.style.setProperty("--c", color);
    b.setAttribute("aria-pressed", on);
    b.onclick = fn;
    return b;
  }
  function renderGroups(){
    const g = $("groups"); g.textContent = "";
    g.append(chip("All", S.g < 0, "var(--ink)", () => set({ g:-1, u:-1 }), true));
    DECK.groups.forEach((x, k) => g.append(chip(x[0], S.g === k, x[1], () => set({ g:k, u:-1 }))));
    const u = $("units"); u.textContent = "";
    if (DECK.twoLevel && S.g >= 0){
      const G = DECK.groups[S.g];
      u.append(chip("All units", S.u < 0, G[1], () => set({ u:-1 })));
      G[2].forEach((name, k) => u.append(chip(name, S.u === k, G[1], () => set({ u:k }))));
      u.hidden = false;
    } else u.hidden = true;
  }
  function render(){
    const d = deck();
    if (S.i >= d.length) S.i = 0;
    const c = d[S.i];
    renderFilters(); renderGroups();
    const G = c ? DECK.groups[c.g] : DECK.groups[Math.max(S.g, 0)];
    document.documentElement.style.setProperty("--gc", G[1]);
    $("grp").textContent = c ? ((c.s ? "★ " : "") + G[0] + " · " + (DECK.twoLevel ? G[2][c.u] : c.k)) : G[0];

    const marked = !!(c && S.marks[c.id]);
    const mb = $("markbtn");
    mb.className = "markbtn" + (marked ? " marked" : "");
    mb.innerHTML = ICON; mb.append(marked ? "Marked" : "Mark for revision");
    mb.setAttribute("aria-pressed", marked);
    mb.setAttribute("aria-label", marked ? "Remove revision mark (M)" : "Mark this card for revision (M)");
    mb.disabled = !c;

    const front = $("front"), back = $("back");
    front.textContent = ""; back.textContent = "";
    if (!c){
      front.append(el("span", "term long", S.mk ? "Nothing marked yet" : "No cards here"), el("span", "hint", DECK.empty));
      back.append(el("span", "def", DECK.empty));
    } else {
      if (c.k) front.append(el("span", "kind", c.k));
      const t = el("span", "term" + (c.t.length > 22 ? " long" : ""), c.t);
      if (c.p){ t.append(el("span", "pos", c.p)); }
      front.append(t, el("span", "hint", DECK.hint));
      const badge = el("span", "badge" + (marked ? " show" : "")); badge.innerHTML = ICON; badge.append("Marked for revision");
      front.append(badge);
      back.append(el("span", "backterm", c.t + (c.p ? " · " + c.p : "")));
      if (c.d) back.append(el("span", "def" + (c.d.length > 110 ? " long" : ""), c.d));
      if (c.a){ const a = el("span", "ar" + (c.d ? "" : " big"), c.a); a.dir = "rtl"; a.lang = "ar"; back.append(a); }
      if (c.e) back.append(el("span", "ex" + (DECK.twoLevel ? " q" : ""), DECK.twoLevel ? "“" + c.e + "”" : c.e));
    }
    const card = $("card");
    card.classList.toggle("flipped", S.flip);
    card.setAttribute("aria-label", c ? (S.flip ? "Answer for " + c.t + ". Press to show the front." : c.t + ". Press to flip.") : "No cards");
    $("count").textContent = d.length ? (S.i + 1) + " / " + d.length : "0 / 0";
    $("shuffle").textContent = S.seed ? "In order" : "Shuffle";
    $("shuffle").setAttribute("aria-pressed", !!S.seed);
    $("live").textContent = c ? (S.flip ? (c.d || "") + " " + (c.a || "") : c.t) : "";
  }

  const step = (k) => { const n = Math.max(deck().length, 1); S.flip = false; S.i = (S.i + k + n) % n; render(); };
  const flip = () => { S.flip = !S.flip; render(); };
  const toggleMark = () => {
    const c = deck()[S.i]; if (!c) return;
    if (S.marks[c.id]) delete S.marks[c.id]; else S.marks[c.id] = 1;
    save(DECK.key, S.marks); render();
  };
  const shuffle = () => set({ seed: S.seed ? 0 : (Date.now() % 233279) + 1 });

  $("card").onclick = flip;
  $("prev").onclick = () => step(-1);
  $("next").onclick = () => step(1);
  $("markbtn").onclick = toggleMark;
  $("shuffle").onclick = shuffle;

  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    const k = e.key;
    const onOtherButton = t && t.tagName === "BUTTON" && t.id !== "card";
    if (k === "ArrowRight") step(1);
    else if (k === "ArrowLeft") step(-1);
    else if (k === " " || k === "ArrowUp" || k === "ArrowDown") flip();
    else if (k === "Enter"){ if (onOtherButton) return; flip(); }
    else if (k === "s" || k === "S") shuffle();
    else if (k === "m" || k === "M") toggleMark();
    else if (k === "b" || k === "B") set({ mk: !S.mk });
    else if ((k === "p" || k === "P") && DECK.star) set({ star: !S.star });
    else if (k === "Home"){ S.i = 0; S.flip = false; render(); }
    else if (k === "End"){ S.i = Math.max(deck().length - 1, 0); S.flip = false; render(); }
    else if (/^[0-9]$/.test(k) && Number(k) <= DECK.maxKey) set({ g: Number(k) - 1, u: -1 });
    else return;
    e.preventDefault();
  });

  const keys = [["←", "→", "move"], ["Space", "flip"], ["M", "mark"], ["B", "marked only"], ["S", "shuffle"]];
  if (DECK.star) keys.push(["P", "priority only"]);
  keys.push(["0", "–", String(DECK.maxKey), DECK.twoLevel ? "groups" : "tabs"], ["Home", "End", "first / last"]);
  const kp = $("keys");
  keys.forEach(parts => {
    const s = el("span");
    parts.forEach((p, idx) => {
      if (idx === parts.length - 1) s.append(el("span", null, p));
      else if (p === "–") s.append("–");
      else s.append(el("kbd", null, p));
    });
    kp.append(s);
  });

  window.addEventListener("storage", (e) => { if (e.key === DECK.key){ S.marks = load(DECK.key, {}); render(); } });
  render();
})();
</script>
